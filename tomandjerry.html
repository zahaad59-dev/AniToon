<!DOCTYPE html>
<html>
<head>
<title>Tom and Jerry</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <a href="index.html" class="logo">AniToon</a>
    <form class="search-bar" action="index.html" method="get">
        <input type="text" name="q" class="search-input" placeholder="Search anime..." aria-label="Search anime">
        <button type="submit" class="search-button">Search</button>
    </form>
</div>

<div class="container">

<a class="back" href="index.html">
<button>← Back</button>
</a>

<div class="banner">
<img src="https://m.media-amazon.com/images/M/MV5BNTQ2MTU3MTAtMDNhMS00YmY0LWFlMDYtNGE2ZTZjZTJkMmU5XkEyXkFqcGc@._V1_.jpg">

<div>
<h1>Tom and Jerry</h1>

<div class="selectors">
<select id="season"></select>
<select id="episode"></select>
<select id="language"></select>
</div>

</div>
</div>

<iframe id="player" src=""></iframe>

</div>

<script>

const episodes = {
    "Episode 1": {
        English: "https://streamtape.com/e/0VWovKw31QIg2a/Tom_and_Jerry_-_001_-_Puss_Gets_the_Boot_%5B1939%5D.avi.mp4"
    },
    "Episode 2": {
        English: "https://streamtape.com/e/J3kOKblx4MTogm/Tom_and_Jerry_-_002_-_Midnight_Snack_%5B1941%5D.avi.mp4"
    },
    "Episode 3": {
        English: "https://streamtape.com/e/ZbDmrBv21jhq8qw/Tom_and_Jerry_-_003_-_Night_Before_Christmas_%5B1941%5D.avi.mp4"
    },
    "Episode 4": {
        English: "https://streamtape.com/e/jVw84zmVjjfGAD/Tom_and_Jerry_-_004_-_Fraidy_Cat_%5B1941%5D.avi.mp4"
    },
    "Episode 5": {
        English: "https://streamtape.com/e/X1bBK20JWrSDlza/Tom_and_Jerry_-_005_-_Dog_Trouble_%5B1942%5D.avi.mp4"
    },
    "Episode 6": {
        English: "https://streamtape.com/e/7ov1D3lxowtAOm4/Tom_and_Jerry_-_006_-_Puss_%27n_Toots_%5B1942%5D.avi.mp4"
    },
    "Episode 7": {
        English: "https://streamtape.com/e/J0j7oxAqBrTjz87/Tom_and_Jerry_-_007_-_The_Bowling_Alley-Cat_%5B1942%5D.avi"
    },
    "Episode 8": {
        English: "https://streamtape.com/e/QKoJz2ljD2f0oJv/Tom_and_Jerry_-_008_-_Fine_Feathered_Friend_%5B1942%5D.avi"
    },
    "Episode 9": {
        English: "https://streamtape.com/e/9eYejgq6WjualxY/Tom_and_Jerry_-_009_-_Sufferin%27_Cats%21_%5B1942%5D.avi"
    },
    "Episode 10": {
        English: "https://streamtape.com/e/grdxmkgpP2TBgY/Tom_and_Jerry_-_010_-_The_Lonesome_Mouse_%5B1943%5D.avi.mp4"
    },
    "Episode 11": {
        English: "https://streamtape.com/e/xZgDqR9rlxu0ZP/Tom_and_Jerry_-_011_-_The_Yankee_Doodle_Mouse_%5B1943%5D.avi.mp4"
    },
    "Episode 12": {
        English: "https://streamtape.com/e/LXejlke68OfRY40/Tom_and_Jerry_-_012_-_Baby_Puss_%5B1943%5D.avi.mp4"
    }
};

for (let i = 13; i <= 114; i++) {
    episodes[`Episode ${i}`] = {
        English: "https://streamtape.com/e/J3kOKblx4MTogm"
    };
}

const data = {
    title: "Tom and Jerry",
    seasons: {
        "Season 1": {
            episodes
        }
    }
};

const season = document.getElementById("season");
const episode = document.getElementById("episode");
const language = document.getElementById("language");
const player = document.getElementById("player");

function loadSeasons(){
    season.innerHTML = "";

    Object.keys(data.seasons).forEach(s=>{
        season.innerHTML += `<option value="${s}">${s}</option>`;
    });

    loadEpisodes();
}

function loadEpisodes(){
    const eps = data.seasons[season.value].episodes;

    episode.innerHTML = "";

    Object.keys(eps).forEach(ep=>{
        episode.innerHTML += `<option value="${ep}">${ep}</option>`;
    });

    loadLanguages();
}

function loadLanguages(){
    const langs = data.seasons[season.value]
    .episodes[episode.value];

    language.innerHTML = "";

    Object.keys(langs).forEach(lang=>{
        language.innerHTML += `<option value="${lang}">${lang}</option>`;
    });

    updateVideo();
}

function updateVideo(){
    player.src = data.seasons[season.value]
    .episodes[episode.value][language.value];
}

season.addEventListener("change", loadEpisodes);
episode.addEventListener("change", loadLanguages);
language.addEventListener("change", updateVideo);

loadSeasons();

</script>

</body>
</html>
